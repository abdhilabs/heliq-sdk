name: HeliqSDK
options:
  bundleIdPrefix: com.heliq
  deploymentTarget:
    iOS: "17.0"
    macOS: "13.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: false
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

packages:
  web3swift:
    url: https://github.com/web3swift-team/web3swift
    from: "3.2.0"

targets:
  HeliqSDK:
    type: framework
    platform: iOS
    sources:
      - path: Sources/HeliqSDK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heliq.SDK
        PRODUCT_NAME: HeliqSDK
        INFOPLIST_FILE: Sources/HeliqSDK/Info.plist
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
    dependencies:
      - package: web3swift

  HeliqSDKTests:
    type: bundle
    platform: iOS
    sources:
      - path: Tests/HeliqSDKTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heliq.SDKTests
        PRODUCT_NAME: HeliqSDKTests
        INFOPLIST_FILE: Tests/HeliqSDKTests/Info.plist
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HeliqSDK.framework/HeliqSDK"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: HeliqSDK

  HeliqSDKIntegrationTests:
    type: bundle
    platform: iOS
    sources:
      - path: Tests/HeliqSDKIntegrationTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heliq.SDKIntegrationTests
        PRODUCT_NAME: HeliqSDKIntegrationTests
        INFOPLIST_FILE: Tests/HeliqSDKIntegrationTests/Info.plist
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HeliqSDK.framework/HeliqSDK"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: HeliqSDK

  HeliqSDKDemo:
    type: application
    platform: iOS
    deploymentTarget:
      iOS: "17.0"
    sources:
      - path: Examples/HeliqSDKDemo
        excludes:
          - "Info.plist"
    info:
      path: Examples/HeliqSDKDemo/Info.plist
      properties:
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundleDisplayName: HeliqSDK Demo
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heliq.SDKDemo
        PRODUCT_NAME: HeliqSDKDemo
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: HeliqSDK

schemes:
  HeliqSDK:
    build:
      targets:
        HeliqSDK: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - HeliqSDKTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  HeliqSDKTests:
    build:
      targets:
        HeliqSDK: all
        HeliqSDKTests: all
    run:
      config: Debug
      enabled: false
    test:
      config: Debug
      targets:
        - HeliqSDKTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      enabled: false

  HeliqSDKIntegrationTests:
    build:
      targets:
        HeliqSDK: all
        HeliqSDKIntegrationTests: all
    run:
      config: Debug
      enabled: false
    test:
      config: Debug
      targets:
        - HeliqSDKIntegrationTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      enabled: false

  HeliqSDKDemo:
    build:
      targets:
        HeliqSDKDemo: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
