name: Documentation

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate --spec project.yml

      - name: Validate public symbol documentation
        run: python3 Scripts/check_docc_coverage.py

      - name: Build DocC archive
        run: |
          xcodebuild docbuild \
            -project HeliqSDK.xcodeproj \
            -scheme HeliqSDK \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build

      - name: Build static documentation site
        run: |
          $(xcrun --find docc) process-archive transform-for-static-hosting \
            build/Build/Products/Debug-iphoneos/HeliqSDK.doccarchive \
            --output-path _site \
            --hosting-base-path heliq-sdk

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
