name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  validate:
    name: Validate Tagged SDK
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-xcode16.4-spm-release-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**', 'Tests/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode16.4-spm-release-${{ hashFiles('Package.swift', 'Package.resolved') }}-

      - name: Validate tagged SDK
        run: swift test --configuration release --no-parallel --filter HeliqSDKTests

  release:
    name: Create Release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists for $RELEASE_TAG; leaving it unchanged."
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "HeliqSDK $RELEASE_TAG" --generate-notes
          fi
